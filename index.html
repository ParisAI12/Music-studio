<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neon Studio Ultimate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">NEON STUDIO ULTIMATE</div>
        <div class="subtitle">browser DAW • multi-instrument • pro features</div>
      </div>

      <div class="transport">
        <button id="playBtn" class="btn play">▶ PLAY</button>
        <button id="stopBtn" class="btn stop">■ STOP</button>
        <div class="bpm">
          <label>BPM</label>
          <input id="bpmInput" type="number" min="30" max="300" value="120" />
        </div>
        <div class="tempo-controls">
          <label>Swing <input id="swing" type="range" min="0" max="0.5" step="0.01" value="0.0"></label>
        </div>
      </div>

      <div class="global-controls">
        <button id="newTrack" class="btn small">New Track</button>
        <button id="saveProject" class="btn small">Save</button>
        <button id="loadProject" class="btn small">Load</button>
        <button id="recordBtn" class="btn small">● RECORD</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="left-panel">
        <div class="tracks-list" id="tracksList"></div>
        <div class="instruments-palette">
          <h4>Instruments</h4>
          <div class="inst-grid">
            <button data-inst="piano" class="inst-btn">Grand Piano (multi-vel)</button>
            <button data-inst="epiano" class="inst-btn">Electric Piano</button>
            <button data-inst="analog" class="inst-btn">Analog Poly</button>
            <button data-inst="fm" class="inst-btn">FM Lead</button>
            <button data-inst="bass" class="inst-btn">Bass Synth</button>
            <button data-inst="drum" class="inst-btn">Drum Sampler</button>
            <button data-inst="pad" class="inst-btn">Orchestral Pad</button>
            <button data-inst="granular" class="inst-btn">Granular</button>
            <button data-inst="wavetable" class="inst-btn">Wavetable</button>
            <button data-inst="sampler" class="inst-btn">Sampler</button>
          </div>
        </div>
      </aside>

      <section class="center-panel">
        <div class="arranger">
          <div class="timeline" id="timeline"></div>
          <div class="tracks" id="tracks"></div>
        </div>

        <div class="editor">
          <div class="sequencer" id="sequencer"></div>
          <div class="piano-roll" id="pianoRoll"></div>
        </div>
      </section>

      <aside class="right-panel">
        <div class="mixer" id="mixer"></div>

        <div class="fx-rack">
          <h4>Master FX</h4>
          <div class="fx-controls">
            <label>Reverb Mix <input id="masterReverbMix" type="range" min="0" max="1" step="0.01" value="0.25"></label>
            <label>Delay Time <input id="masterDelayTime" type="range" min="0" max="1" step="0.01" value="0.25"></label>
            <label>Master Limiter <input id="masterLimiter" type="range" min="0.2" max="1" step="0.01" value="0.95"></label>
          </div>
        </div>

        <div class="visuals">
          <canvas id="spectrum" width="320" height="120"></canvas>
          <canvas id="osc" width="320" height="120"></canvas>
        </div>
      </aside>
    </main>

    <div id="pluginContainer"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
